[package]
name = "umbilical"
description = "Keeps claude remote-control running in your project directories"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "umbilical_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
umbilical-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
