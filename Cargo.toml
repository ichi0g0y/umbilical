[workspace]
resolver = "3"
members = ["crates/umbilical-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ichi0g0y/umbilical"

[workspace.dependencies]
umbilical-core = { path = "crates/umbilical-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
toml = "1.1.6"
dirs = "7.0.0"
anyhow = "1.0.104"

[profile.release]
codegen-units = 1
lto = true
strip = true
