# Nightly build of main, published to the pre-release with the tag "nightly".
# Version: <next patch after the latest v* tag>-nightly.<YYYYMMDDHHMM>
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main did not change
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [ "$last" = "$GITHUB_SHA" ] && [ "$FORCE" != "true" ]; then
            echo "main did not change since the last nightly"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        if: steps.check.outputs.skip == 'false'
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="${major}.${minor}.$((patch + 1))-nightly.$(date -u +%Y%m%d%H%M)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nightly version: $version"
      - id: release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name=nightly \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Nightly $VERSION" \
            -f body="Nightly build of \`main\` at $GITHUB_SHA. It can be broken." \
            -F prerelease=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Set version
        shell: bash
        run: echo '{"version":"${{ needs.prepare.outputs.version }}"}' > src-tauri/tauri.version.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.version.json
          updaterJsonPreferNsis: true
